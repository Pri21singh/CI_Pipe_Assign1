name: CI Pipeline

on:
  push:
    branches:
      - CICD_Priya  
  pull_request:
    branches:
        - CICD_Priya

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest -v tests/

  docker-build-run:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t banking-app:PS .

      - name: Run Docker Container
        run: docker run -d --name banking-container banking-app:PS

      - name: Show Running Container
        run: docker ps -a

      - name: Stop and Remove Container
        run: |
          docker stop banking-container
          docker rm banking-container
